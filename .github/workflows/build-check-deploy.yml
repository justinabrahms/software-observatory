name: Build, check, deploy

on:
  # `push` is intentionally unscoped (no `branches:` filter): six commits
  # (05dd6a8..c3a0497) landed on fix/audit-remediation after PR #127 merged
  # and sat completely untested — `push` was main-only and no PR was open, so
  # CI had nothing to run — until a second PR (#129) was opened days later and
  # finally exercised them. `pull_request` alone does not cover a branch with
  # no open PR, so `push` has to run everywhere too. `pull_request` stays
  # alongside it because it is what covers PRs from forks, which `push` never
  # sees. The `deploy` and `publish-npm` jobs are unaffected by this: they
  # carry their own `github.ref == 'refs/heads/main'` guard below, so a push
  # to any other branch runs `check` only.
  push:
  pull_request:
  schedule:
    # Weekly external-link audit, Mondays 06:17 UTC. Network checks are slow and
    # flaky under PR load, so they are not on the push path; this job carries
    # them and files an issue when links rot, so nobody has to remember to look.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands on the same branch.
#
# `github.event_name` is IN THE GROUP KEY on purpose, so a push run and a
# pull_request run of the same branch never cancel each other. Deduplicating
# the pair is the `check` job's `if:` below, and the two mechanisms are not
# composable: with a shared group, whichever run started second cancelled the
# first, and when the survivor was the pull_request run its `check` job
# skipped — so the push run that would have done the work was cancelled and
# the commit went completely untested. Observed on PR #130, twice:
# `push cancelled` + `check skipping` = a green PR that ran nothing.
#
# Cancelling is also not how to dedupe the pair even when it works: GitHub
# reports a cancelled run as a FAILED check, so the PR carries a red X from
# its own duplicate. `github.head_ref` is set only for `pull_request` events (and
# is the source branch there); it falls back for push, schedule and
# workflow_dispatch.
#
# That fallback is `github.ref_name`, NOT `github.ref`. head_ref is a bare
# branch name ("topic"); github.ref is a full ref path ("refs/heads/topic").
# Pairing the two puts a branch's push run and its pull_request run in two
# different groups and collapses nothing. Observed, not reasoned about: PR
# #130 was opened with `github.ref` here and ran `check` twice on one commit.
#
# cancel-in-progress is deliberately NOT unconditional. On a feature branch,
# superseding an in-flight run is free. On main it is not: the run carries the
# `deploy` job, and cancelling that mid-rsync leaves the live site in a
# half-synced state that nothing here would detect or repair. Two merges
# landing close together is exactly when that would happen, which is exactly
# when you least want a truncated deploy. So main queues; every other ref
# cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) for the publish job

jobs:
  # ---------------------------------------------------------------------------
  # Every gate, in one job, cheapest and most diagnostic first. The steps invoke
  # Makefile targets rather than scripts directly so that `make check` locally
  # and CI cannot diverge — there is one definition of what each gate is.
  #
  # Ordering: the generator's own snapshot suite runs first (it is the fastest
  # gate and the one that fails on a broken renderer), then the content-only
  # checks, and only then the build. A frontmatter or citation error is a
  # property of the content, not of the generated site, and reporting it in 2
  # seconds beats reporting it after a full build. The link check necessarily
  # runs after, since it reads the generated HTML.
  # ---------------------------------------------------------------------------
  check:
    # Do the work exactly once per commit. `push` now covers every branch, so
    # for a branch in this repo the push run is the one that matters and the
    # pull_request run would be a byte-for-byte duplicate of it. Skipping it
    # here is quiet — a skipped job is neutral on the PR, where a cancelled
    # one is red.
    #
    # The condition deliberately still runs for pull_request events whose head
    # repo is NOT this one: a fork's branch never produces a push event here,
    # so `pull_request` is the only trigger that ever sees fork contributions.
    # Dropping it entirely would leave every external PR untested.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # Golden-file snapshot tests for build.py, over a fixture corpus in
      # tests/fixtures/. Runs first because it is the fastest gate in the job
      # (~0.2s, no network, no browser) and because it is the one that fails on
      # a broken renderer: validating real content against a generator whose
      # own fixtures no longer render is wasted CI time. Also asserts the build
      # is byte-for-byte deterministic (#91) and that each input gate fails
      # before writing a file (#116).
      - name: Test the site generator
        run: make test

      # Also asserts that content, build.py and scripts/vocabulary.py still
      # agree on the reference-kind vocabulary. See check_vocabulary_drift().
      - name: Check frontmatter and vocabulary
        run: make check-frontmatter

      - name: Check citations (offline)
        run: make check-citations

      - name: Build
        run: make build

      - name: Check links (internal)
        run: make check-links

      - name: Test CLI
        run: make cli-test

      # Fails if any top-level path is in neither the deploy allow-list nor the
      # explicitly-private list, so a new directory cannot silently reach the
      # public site or silently fail to.
      - name: Check deploy manifest
        run: make check-deploy

      # Left unscoped to main on purpose: `push` now covers every branch (see
      # the trigger comment above), so this uploads on every branch push too.
      # That is the point, not a side effect — the whole reason to widen
      # `push` was to give feature branches the same CI signal main gets, and
      # a downloadable build is part of that signal (e.g. inspecting output
      # without waiting on a PR). The artifact is small, capped at 7 days,
      # and scoped per-run, so there is no cross-branch collision or
      # meaningful storage cost to justify narrowing it back to main.
      - name: Upload built site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            index.html
            404.html
            catalog/
            atlas/
            framework/
            glossary/
            about/
            sensors/
            css/
            js/
            og/
            search-index.json
            sitemap.xml
            rss.xml
            llms.txt
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # NOTE: the gates are deliberately NOT repeated here. They ran in `check`
      # on this same commit with this same code; re-running them doubled CI time
      # and, more to the point, made the pipeline look like it had two
      # independent opinions when it had one.

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SOFTWAREOBSERVATORY_DEPLOY_KEY }}" > ~/.ssh/softwareobservatory-deploy
          chmod 600 ~/.ssh/softwareobservatory-deploy
          {
            echo "Host abrah.ms"
            echo "  HostName abrah.ms"
            echo "  User observer"
            echo "  IdentityFile ~/.ssh/softwareobservatory-deploy"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Add known_hosts
        run: |
          echo "abrah.ms ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDWwAzVcplm5TMfVqPvxIhmcGtahqbiKLyXUvnyvlJSG" >> ~/.ssh/known_hosts
          echo "abrah.ms ssh-rsa " >> ~/.ssh/known_hosts

      # `make deploy` runs check-deploy, builds, and rsyncs the ALLOW-LIST
      # defined once in the Makefile. The workflow deliberately does not carry
      # its own copy of the rsync rules: the previous deny-list existed in two
      # places that had already drifted apart, and the union of what they forgot
      # to exclude is what ended up on the public web server.
      - name: Deploy
        run: make deploy

  publish-npm:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # NOTE: no registry-url. Setting registry-url makes setup-node write
          # a placeholder NODE_AUTH_TOKEN into .npmrc, which makes npm publish
          # use token auth instead of OIDC trusted publishing (and fail E404).

      - name: Upgrade npm for trusted publishing
        # Node 22's bundled npm (10.x) predates OIDC trusted publishing, which
        # needs npm >= 11.5.1. Without this the publish falls back to
        # interactive login and fails ENEEDAUTH.
        run: npm install -g npm@^11.5.1

      - name: Publish CLI to npm
        working-directory: cli
        # Skip if the version in package.json already exists on npm.
        # npm rejects republishing the same version with E403.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view softwareobservatory version 2>/dev/null || echo "none")
          if [ "$PKG_VERSION" = "$PUBLISHED" ]; then
            echo "Version $PKG_VERSION already published — skipping"
          else
            # OIDC trusted publishing: npm exchanges the job's id-token, so no
            # long-lived secret is stored. Requires the package on npmjs.com to
            # list this repo + workflow as a trusted publisher (already configured).
            npm publish --provenance
          fi

  # ---------------------------------------------------------------------------
  # Weekly network audit. check_links.py --external has existed, worked, and
  # never once run in CI; 295 external URLs were rotting with nothing watching.
  # Link rot is not caused by a push, so gating pushes on it would only add
  # flake — it is a background property of the corpus, and belongs on a timer
  # with an issue as its output.
  # ---------------------------------------------------------------------------
  external-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # The external checkers read the generated site, so it has to exist. The
      # TTL caches (.link-cache.json / .citation-cache.json) are not restored
      # between runs, so every scheduled run is a full, uncached sweep.
      - name: Build
        run: make build

      - name: External link check
        id: links
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python scripts/check_links.py --external --ttl 30 2>&1 | tee links.log

      - name: External citation check
        id: citations
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python scripts/check_citations.py --external --ttl 30 2>&1 | tee citations.log

      - name: File an issue if anything rotted
        if: steps.links.outcome == 'failure' || steps.citations.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The weekly external audit failed. Run: $RUN_URL"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| external links | ${{ steps.links.outcome }} |"
            echo "| external citations | ${{ steps.citations.outcome }} |"
            echo
            echo '### check_links.py --external'
            echo '```'
            tail -c 20000 links.log 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo '### check_citations.py --external'
            echo '```'
            tail -c 20000 citations.log 2>/dev/null || echo "(no output)"
            echo '```'
          } > issue.md

          # One rolling issue, not one per week. If last week's is still open,
          # comment on it; a pile of near-identical issues is how a monitor
          # trains people to ignore it.
          EXISTING=$(gh issue list --label link-rot --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue.md
            echo "Commented on existing issue #$EXISTING"
          else
            gh label create link-rot \
              --description "Automated weekly external link/citation audit" \
              --color B60205 2>/dev/null || true
            gh issue create \
              --title "External link/citation audit failed ($(date -u +%Y-%m-%d))" \
              --label link-rot \
              --body-file issue.md
          fi

      # The steps above are continue-on-error so that both audits always run and
      # the issue always gets filed; this makes the job itself go red so the
      # scheduled run is visibly failing in the Actions list too.
      - name: Reflect audit result in job status
        if: steps.links.outcome == 'failure' || steps.citations.outcome == 'failure'
        run: |
          echo "External audit failed — see the link-rot issue."
          exit 1

name: Build, check, deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) for the publish job

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install pyyaml markdown

      - name: Build
        run: .venv/bin/python scripts/build.py

      - name: Check frontmatter
        run: .venv/bin/python scripts/check_frontmatter.py

      - name: Check links
        run: .venv/bin/python scripts/check_links.py

      - name: Test CLI
        run: node cli/test/smoke.mjs

      - name: Upload built site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            index.html
            pages/
            css/
            js/
            search-index.json
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install pyyaml markdown

      - name: Build
        run: .venv/bin/python scripts/build.py

      - name: Check frontmatter
        run: .venv/bin/python scripts/check_frontmatter.py

      - name: Check links
        run: .venv/bin/python scripts/check_links.py

      - name: Test CLI
        run: node cli/test/smoke.mjs

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SOFTWAREOBSERVATORY_DEPLOY_KEY }}" > ~/.ssh/softwareobservatory-deploy
          chmod 600 ~/.ssh/softwareobservatory-deploy
          {
            echo "Host abrah.ms"
            echo "  HostName abrah.ms"
            echo "  User observer"
            echo "  IdentityFile ~/.ssh/softwareobservatory-deploy"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Add known_hosts
        run: |
          echo "abrah.ms ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDWwAzVcplm5TMfVqPvxIhmcGtahqbiKLyXUvnyvlJSG" >> ~/.ssh/known_hosts
          echo "abrah.ms ssh-rsa " >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/softwareobservatory-deploy" \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='.github/' \
            --exclude='content/' \
            --exclude='templates/' \
            --exclude='archive-*/' \
            --exclude='scripts/' \
            --exclude='cli/' \
            --exclude='Makefile' \
            --exclude='.gitignore' \
            --exclude='AGENTS.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='README.md' \
            --exclude='TODO.md' \
            ./ observer@abrah.ms:.

  publish-npm:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish CLI to npm
        working-directory: cli
        # Trusted publishing: npm exchanges the job's OIDC id-token, so no
        # NPM_TOKEN secret is needed. Requires the package on npmjs.com to
        # list this repo + workflow as a trusted publisher.
        run: npm publish --access public --provenance

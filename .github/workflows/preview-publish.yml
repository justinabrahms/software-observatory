name: Publish PR preview
on:
  workflow_run:
    workflows: [Build PR preview]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: preview-pages-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview-publishing
    steps:
      # Only default-branch code runs with publication credentials. The key
      # can write only the separate, public preview repository, not production.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: preview
        env:
          PREVIEW_REPOSITORY: ${{ vars.PREVIEW_REPOSITORY }}
        with:
          script: |
            const prepare = require('./scripts/preview-publish.cjs');
            await prepare({github, context, core});
      - name: Validate and unpack static files
        if: steps.preview.outputs.number != ''
        run: python3 scripts/preview.py --archive "$RUNNER_TEMP/preview.zip" --output "$RUNNER_TEMP/preview"
      - name: Configure preview-repository key
        if: steps.preview.outputs.number != ''
        env:
          PREVIEW_KEY: ${{ secrets.PREVIEW_PUBLISH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_KEY"
          printf '%s\n' "$PREVIEW_KEY" > "$RUNNER_TEMP/preview-key"
          chmod 600 "$RUNNER_TEMP/preview-key"
          ssh-keygen -y -f "$RUNNER_TEMP/preview-key" > /dev/null
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/preview-known-hosts"
      - name: Publish only this PR's static snapshot
        if: steps.preview.outputs.number != ''
        env:
          PREVIEW_REPOSITORY: ${{ vars.PREVIEW_REPOSITORY }}
          PR_NUMBER: ${{ steps.preview.outputs.number }}
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/preview-key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/preview-known-hosts"
          git clone --depth 1 --branch main "git@github.com:$PREVIEW_REPOSITORY.git" "$RUNNER_TEMP/pages-state"
          # A snapshot repository must not redirect writes through symlinks.
          if [ -n "$(find "$RUNNER_TEMP/pages-state" -type l -print -quit)" ]; then
            echo 'Preview repository contains a symlink; refusing to publish.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pages-state/previews/pr-$PR_NUMBER"
          rsync -a --delete "$RUNNER_TEMP/preview/" "$RUNNER_TEMP/pages-state/previews/pr-$PR_NUMBER/"
          cp "$RUNNER_TEMP/preview-links.json" "$RUNNER_TEMP/pages-state/previews/pr-$PR_NUMBER/preview-revision.json"
          python3 scripts/preview_index.py "$RUNNER_TEMP/pages-state"
          git -C "$RUNNER_TEMP/pages-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/pages-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/pages-state" add previews index.html robots.txt .nojekyll
          if ! git -C "$RUNNER_TEMP/pages-state" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/pages-state" commit -m "Update preview for PR #$PR_NUMBER"
            git -C "$RUNNER_TEMP/pages-state" push origin HEAD:main
          fi
      - name: Verify deployment and served pages
        if: steps.preview.outputs.number != ''
        run: python3 scripts/verify_preview.py "$RUNNER_TEMP/preview-links.json" --wait 180
      - name: Update PR preview comment
        if: steps.preview.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/preview-links.json`));
            const issue_number = Number('${{ steps.preview.outputs.number }}');
            const marker = '<!-- observatory-preview -->';
            const body = `${marker}\nPreview for \`${data.sha}\` (public, noindex, separate preview account):\n\n` +
              data.links.map(link => `- [${link.label}](${link.url})`).join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number});
            const old = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({...context.repo, comment_id: old.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number, body});
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/preview-key"
